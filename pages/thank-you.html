<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Marshall &amp; Co. Bespoke Home Improvements | Perth</title>
  <meta name="description" content="Thank you for getting in touch with Marshall &amp; Co. Bespoke Home Improvements. Lee will be in touch shortly." />
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" href="../assets/imgs/general_imgs/favicon.png" type="image/png">
      <link rel="apple-touch-icon" href="../assets/imgs/general_imgs/favicon.png">
  <link rel="manifest" href="../site.webmanifest">
  <meta name="theme-color" content="#303030">
  <style>
    .word-mask { display: inline-block; vertical-align: bottom; clip-path: inset(-80% -20% 0% -20%); padding-bottom: 0.25em; margin-bottom: -0.25em; }
    .word-mask-inner { display: inline-block; transform: translateY(110%); transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); will-change: transform; }
    h1 .word-mask-inner { transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) !important; }
    .reveal.active .word-mask-inner { transform: translateY(0); }
    .fade-up { opacity: 0; transform: translateY(18px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.active .fade-up { opacity: 1; transform: translateY(0); }
  </style>
</head>

<body class="flex flex-col min-h-screen antialiased" style="background:#303030;">

  <div id="header-placeholder"></div>

  <main class="flex-grow flex items-center justify-center py-24 pt-40 md:pt-52">
    <div class="container mx-auto px-6 max-w-3xl text-center">

      <div class="reveal flex flex-col items-center">

        <!-- Gold checkmark -->
        <div class="fade-up w-20 h-20 rounded-full flex items-center justify-center mb-10 border-2 border-[#e8b238]" style="transition-delay:100ms; background:rgba(232,178,56,0.08);">
          <svg class="w-10 h-10" fill="none" stroke="#e8b238" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>

        <!-- Eyebrow -->
        <p class="t-label gs-tagline fade-up" style="font-size:0.77rem !important; font-weight:500; letter-spacing:0.25em; transition-delay:150ms; color:rgba(255,255,255,0.65);">
          Enquiry Received
        </p>

        <!-- Heading -->
        <h1 class="t-section-heading text-white" style="font-size: clamp(2.54rem, 4.07vw, 3.63rem) !important; font-weight:700; margin-top:1.5rem !important; margin-bottom:1.275rem !important;">
          <span class="word-mask"><span class="word-mask-inner" style="transition-delay:200ms;">Thank You</span></span>
        </h1>

        <!-- Body -->
        <p class="t-section-body font-body fade-up" style="font-size:1.1rem !important; font-weight:400; line-height:1.7; color:rgba(255,255,255,0.78); max-width:36rem; margin:0 auto; margin-top:1.25rem !important; transition-delay:400ms;">
          Your message has reached Lee directly. He personally reviews every enquiry and will be in touch shortly to arrange your free, no-obligation consultation.
        </p>

        <!-- Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 justify-center mt-10 fade-up" style="transition-delay:520ms;">
          <a href="../index.html" class="btn-primary" aria-label="Return to the Marshall and Co homepage">Back to Homepage</a>
          <a href="../gallery.html" class="btn-ghost" aria-label="View our project gallery">View Our Work</a>
        </div>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="../global.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        document.querySelectorAll('.reveal').forEach(function (el) {
          el.classList.add('active');
        });
      }, 150);
    });
  </script>

</body>
</html>
